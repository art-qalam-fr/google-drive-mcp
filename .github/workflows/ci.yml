name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Syntax check all JS files
        run: |
          set -e
          git ls-files '*.js' '*.mjs' '*.cjs' | grep -v node_modules | while read -r f; do
            node --check "$f" || exit 1
          done
